name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag (v1.2.3)
        required: true
        type: string
permissions:
  contents: write
  packages: write
  security-events: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  security:
    uses: ./.github/workflows/security.yml
    secrets: inherit
  database:
    uses: ./.github/workflows/database.yml
    secrets: inherit
  docker:
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
  package:
    name: package-release
    needs: [ci, security, database, docker]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/tafseel
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semantic version"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release commit is not on main"; exit 1; }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore && dotnet restore Tafseel.sln --locked-mode
      - name: Publish versioned application
        run: dotnet publish src/Tafseel.Api/Tafseel.Api.csproj -c Release --no-restore -o artifacts/release/publish -p:Version=${VERSION#v} -p:InformationalVersion=${VERSION#v}+${GITHUB_SHA}
      - run: dotnet ef migrations script --idempotent --project src/Tafseel.Infrastructure --startup-project src/Tafseel.Api -o artifacts/release/tafseel-idempotent.sql
        env:
          Jwt__SigningKey: release-only-signing-key-with-at-least-32-characters
          Resend__ApiToken: release-token
          Payments__WebhookSecret: release-webhook-secret-with-at-least-32-characters
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: artifacts/release/publish
          format: spdx-json
          output-file: artifacts/release/sbom.spdx.json
      - name: Capture immutable image metadata
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE:$VERSION"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          printf '{"version":"%s","revision":"%s","image":"%s"}\n' "$VERSION" "$GITHUB_SHA" "$DIGEST" > artifacts/release/docker-metadata.json
          printf '# Release gate summary\n\nAll reusable CI, security, database, and Docker gates passed in GitHub Actions run %s.\n' "$GITHUB_RUN_ID" > artifacts/release/gate-summary.md
      - name: Archive and checksum
        run: |
          tar -C artifacts/release -czf artifacts/tafseel-${VERSION}.tar.gz publish
          (cd artifacts/release && sha256sum tafseel-idempotent.sql sbom.spdx.json docker-metadata.json gate-summary.md > SHA256SUMS)
          (cd artifacts && sha256sum tafseel-${VERSION}.tar.gz >> release/SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ env.VERSION }}
          path: |
            artifacts/tafseel-${{ env.VERSION }}.tar.gz
            artifacts/release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tafseel-${{ env.VERSION }}.tar.gz
            artifacts/release/tafseel-idempotent.sql
            artifacts/release/sbom.spdx.json
            artifacts/release/docker-metadata.json
            artifacts/release/gate-summary.md
            artifacts/release/SHA256SUMS
