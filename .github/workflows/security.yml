name: Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  dependencies-and-secrets:
    name: dependencies-and-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Tafseel.sln --locked-mode
      - run: dotnet list Tafseel.sln package --vulnerable --include-transitive
      - run: dotnet list Tafseel.sln package --deprecated
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Production configuration policy
        shell: pwsh
        run: |
          $config = Get-Content -Raw src/Tafseel.Api/appsettings.Production.json
          if ($config -match '"Provider"\s*:\s*"Mock"') { throw "Production configuration selects a mock provider." }
          if ($config -match '\bre_[A-Za-z0-9_-]{20,}') { throw "Resend credential found in tracked production configuration." }
          if ($config -match '"SigningKey"\s*:\s*"(?!REPLACE_)[^"]{32,}"') { throw "JWT key found in tracked production configuration." }
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
      - uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
