name: Deploy Staging - Azure App Service
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Validated main commit SHA
        required: true
        type: string
permissions:
  id-token: write
  contents: read
  checks: read
concurrency:
  group: tafseel-staging-azure
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_CORE_OUTPUT: none
  DEPLOY_SHA: ${{ inputs.sha }}
  AZURE_WEBAPP_NAME: tafseel-api-hisham
  APP_URL: ${{ vars.APP_URL }}
jobs:
  deploy:
    name: staging-azure
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate requested revision
        shell: bash
        run: '[[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full Git SHA is required."; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify main ancestry and required gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main ||
            { echo "Requested revision is not on main."; exit 1; }
          required=("build-and-provider-neutral" "sql-server" "publish-smoke" "dependencies-and-secrets" "codeql-csharp" "codeql-javascript-typescript" "migrations" "image")
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs?per_page=100")"
          for name in "${required[@]}"; do
            jq -e --arg n "$name" '[.check_runs[] | select(.name==$n and .conclusion=="success")] | length > 0' <<<"$checks" >/dev/null ||
              { echo "Required successful check missing: $name"; exit 1; }
          done
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore Tafseel.sln --locked-mode
      - name: Build
        run: dotnet build Tafseel.sln -c Release --no-restore
      - name: Publish API and frontend assets
        run: dotnet publish src/Tafseel.Api/Tafseel.Api.csproj -c Release --no-build -o ./artifacts/azure-publish
      - name: Validate publish output
        shell: pwsh
        run: ./scripts/ci/validate-publish.ps1 -PublishDirectory ./artifacts/azure-publish
      - name: Azure login with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy prebuilt package
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./artifacts/azure-publish
      - name: Post-deployment smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo "staging APP_URL variable is required."; exit 1; }
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 20 "$APP_URL/health/ready" >/dev/null; then break; fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 20 "$APP_URL/health/ready" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$APP_URL/health/live" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "$APP_URL/" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/api/v1/auth/me")" = 401
      - name: Deployment evidence
        if: always()
        shell: bash
        run: |
          echo "## Azure staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations were not executed by this workflow or application startup." >> "$GITHUB_STEP_SUMMARY"
