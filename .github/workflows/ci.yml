name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  build-and-test:
    name: build-and-provider-neutral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: dotnet tool restore
      - run: dotnet restore Tafseel.sln --locked-mode
      - run: dotnet format Tafseel.sln --verify-no-changes --no-restore
      - run: dotnet build Tafseel.sln -c Release --no-restore
      - name: Architecture
        id: architecture
        run: dotnet test tests/Tafseel.ArchitectureTests -c Release --no-build --logger "trx;LogFileName=architecture.trx" --results-directory TestResults/architecture
      - name: Domain
        id: domain
        run: dotnet test tests/Tafseel.Domain.Tests -c Release --no-build --collect "XPlat Code Coverage" --logger "trx;LogFileName=domain.trx" --results-directory TestResults/domain
      - name: Application
        id: application
        run: dotnet test tests/Tafseel.Application.Tests -c Release --no-build --collect "XPlat Code Coverage" --logger "trx;LogFileName=application.trx" --results-directory TestResults/application
      - name: Provider-neutral integration
        id: integration
        run: dotnet test tests/Tafseel.IntegrationTests -c Release --no-build --filter "Category!=SqlServer" --collect "XPlat Code Coverage" --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration
      - name: API contract (Angular client against the API snapshot)
        run: node scripts/ci/check-api-contract.mjs --strict
      - name: Production fail-closed structure
        run: node scripts/ci/check-production-infrastructure.mjs
      - name: JavaScript syntax
        run: node scripts/ci/check-js.mjs
      - name: Staging deploy gate script tests
        shell: pwsh
        run: ./scripts/ci/tests/deploy-gates.tests.ps1
      - name: Staging migration automation tests
        shell: pwsh
        run: ./scripts/ci/tests/staging-migration.tests.ps1
      - name: Coverage summary
        shell: pwsh
        run: ./scripts/ci/coverage-summary.ps1
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## CI build and provider-neutral tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deterministic restore, format, build, project tests, coverage, and JavaScript checks executed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && (steps.architecture.conclusion == 'success' || steps.architecture.conclusion == 'failure' || steps.domain.conclusion == 'success' || steps.domain.conclusion == 'failure' || steps.application.conclusion == 'success' || steps.application.conclusion == 'failure' || steps.integration.conclusion == 'success' || steps.integration.conclusion == 'failure') }}
        with:
          name: ci-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: error
  sql-server:
    name: sql-server
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      CI_SQL_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
      TAFSEEL_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: test -n "$CI_SQL_PASSWORD" || { echo 'CI_SQL_PASSWORD is required'; exit 1; }
      - run: dotnet restore Tafseel.sln --locked-mode
      - run: dotnet build Tafseel.sln -c Release --no-restore
      - name: SQL Server integration
        id: sql-tests
        run: dotnet test tests/Tafseel.IntegrationTests -c Release --no-build --filter "Category=SqlServer" --collect "XPlat Code Coverage" --logger "trx;LogFileName=sql-server.trx" --results-directory TestResults/sql-server
      - name: SQL coverage summary
        shell: pwsh
        run: ./scripts/ci/coverage-summary.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && (steps.sql-tests.conclusion == 'success' || steps.sql-tests.conclusion == 'failure') }}
        with:
          name: sql-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: error
  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install the client
        working-directory: frontend-angular
        run: npm ci
      # pretest runs check:i18n and check:styles (component budget, UX-06 and skip-link guards) first.
      - name: Angular unit tests
        working-directory: frontend-angular
        run: npm test -- --watch=false
  browser-journeys:
    # SDLC Gate 5: every business journey in tests/browser/*.e2e.mjs, against a published build in
    # Development (dev outbox, mock payment simulator), each on its own fresh database.
    name: browser-journeys
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TAFSEEL_E2E_SQL_SERVER: localhost,1433
      TAFSEEL_E2E_SQL_USER: sa
      SQLCMDPASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: test -n "$SQLCMDPASSWORD" || { echo 'CI_SQL_PASSWORD is required'; exit 1; }
      - name: sqlcmd on the runner
        run: |
          if command -v sqlcmd >/dev/null; then sqlcmd -? | head -n 2
          elif [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -? | head -n 2
          else echo 'The journeys read the database through sqlcmd, which this runner image does not have.'; exit 1; fi
      - run: dotnet restore Tafseel.sln --locked-mode
      - name: Publish the host (builds the Angular client)
        run: dotnet publish src/Tafseel.Api/Tafseel.Api.csproj -c Release --no-restore -o artifacts/e2e-publish
      - name: Build the seeder
        run: dotnet restore scripts/dev/E2ESeed --locked-mode && dotnet build scripts/dev/E2ESeed -c Release --no-restore
      - name: Install Playwright
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser journeys
        run: >-
          node scripts/ci/run-browser-journeys.mjs
          --publish=artifacts/e2e-publish
          --seed=scripts/dev/E2ESeed/bin/Release/net8.0/E2ESeed.dll
          --artifacts=TestResults/browser-journeys
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: browser-journeys-${{ github.run_id }}
          path: TestResults/browser-journeys
          if-no-files-found: warn
  publish:
    name: publish-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore Tafseel.sln --locked-mode
      - run: dotnet build Tafseel.sln -c Release --no-restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Tafseel.Infrastructure --startup-project src/Tafseel.Api --configuration Release --no-build
        env:
          Jwt__SigningKey: ci-only-signing-key-with-at-least-32-characters
          Resend__ApiToken: ci-only-token
          Payments__WebhookSecret: ci-only-webhook-secret-with-at-least-32-characters
      - run: dotnet publish src/Tafseel.Api/Tafseel.Api.csproj -c Release --no-restore -o artifacts/publish
      - shell: pwsh
        run: ./scripts/ci/validate-publish.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-smoke-${{ github.run_id }}
          path: artifacts/publish
