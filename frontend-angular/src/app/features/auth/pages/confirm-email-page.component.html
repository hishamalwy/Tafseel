<tf-auth-shell
  mainId="confirm-email-main"
  layoutClass="tf-confirm-email-layout"
  mainClass="tf-confirm-email-main"
  brandClass="tf-confirm-email-brand"
  toolsClass="tf-confirm-email-tools"
  [homeLabel]="t('nav_home', 'Tafseel home')">

  <div class="tf-confirm-email-wrap">
    <section animate.enter="tf-motion-enter" class="tf-confirm-email-card" aria-labelledby="confirm-email-title">
      <div class="tf-confirm-email-heading">
        <div class="tf-confirm-email-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 6.5h16v11H4z" />
            <path d="m4.5 7 7.5 6 7.5-6" />
            <path d="m8.5 17.5 3.5-3 3.5 3" />
          </svg>
        </div>
        <h1 id="confirm-email-title">{{ heading() }}</h1>
      </div>

      <p class="tf-confirm-email-lede">{{ body() }}</p>

      @if (email(); as address) {
        <p class="tf-confirm-email-address" dir="ltr">{{ address }}</p>
      }

      <div class="tf-confirm-email-note">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" />
        </svg>
        <p>{{ help() }}</p>
      </div>

      @if (email()) {
        <button type="button" class="tf-button tf-confirm-email-login" (click)="resend()" [disabled]="resending()" [tfActionFeedback]="resending() ? 'busy' : resendStatus() === 'sent' ? 'success' : 'idle'">
          {{ t('auth_resend_confirmation', 'Resend confirmation email') }}
        </button>
        @if (resendStatus() === 'sent') {
          <tf-ui-state state="success" variant="confirmation" [compact]="true" [title]="t('auth_confirmation_resent', 'If that account exists, a confirmation email is on its way.')" />
        } @else if (resendStatus() === 'failed') {
          <p role="alert">{{ t('confirm_email_resend_failed', 'Could not send the email. Please try again.') }}</p>
        }
      }

      <a class="tf-button tf-confirm-email-login" routerLink="/auth" [queryParams]="loginQuery()">{{ loginLabel() }}</a>
    </section>
  </div>
</tf-auth-shell>
