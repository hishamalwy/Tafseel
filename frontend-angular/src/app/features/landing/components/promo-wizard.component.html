<div [class]="scrimClass()" role="presentation" (click)="close()">
  <section #dialog data-promo-wizard tabindex="-1" [class]="wizardClass()"
           data-accent="eggplant" role="dialog" aria-modal="true"
           aria-labelledby="promo-wizard-title" (click)="$event.stopPropagation()">
    <header class="tf-promo-wizard-head">
      @if (eyebrow(); as text) {
        <p class="tf-promo-eyebrow">
          <span class="tf-promo-eyebrow-mark" aria-hidden="true"></span>
          <span>{{ text }}</span>
        </p>
      }
      <span class="tf-promo-wizard-step"></span>
      <button type="button" class="tf-promo-wizard-close" (click)="close()"
              [attr.aria-label]="copy().promoClose" [title]="copy().promoClose">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </header>

    <div class="tf-promo-wizard-body" data-step="0" [style]="bodyStyle()">
      <tf-promotion-content [title]="title()" [body]="body()" [lead]="lead()" [figure]="highlight()" [figureNote]="copy().promoOff"
        [dateDay]="dateDay()" [dateMonth]="dateMonth()" [code]="kind() === 'discount' ? code() : ''" [codeLabel]="copy().promoCodeLabel"
        [copyLabel]="copying() ? copy().promoCopying : copy().promoCopy" [units]="countdown()" [countdownLabel]="copy().promoCountdown" (copyRequested)="copyCode()" />
      @if (copyFailed()) {
        <p class="tf-promo-copy-status" role="status">{{ copy().promoCopyFailed }} <code dir="ltr">{{ code() }}</code></p>
      }
    </div>

    <footer class="tf-promo-wizard-foot">
      <div class="tf-promo-wizard-actions">
        @if (showsCta()) {
          <a class="tf-promo-cta" [href]="href()" (click)="claim()">{{ ctaLabel() }}</a>
        }
        <button type="button" class="tf-promo-wizard-next" (click)="close()">{{ copy().promoDone }}</button>
      </div>
    </footer>
  </section>
</div>
