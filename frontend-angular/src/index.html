<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Tafseel</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Tafseel connects students across Saudi Arabia with verified teachers." />
  <meta name="theme-color" content="#F7F4EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="favicon.ico" />
  <!-- Paint the stored theme before first paint, so there is no light flash on a
       dark-mode reload. Kept inline and tiny on purpose; everything else is bundled. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tafseel-theme');
        var dark = t === 'dark' || (t !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var l = localStorage.getItem('tafseel-lang');
        if (l === 'en' || l === 'ar') {
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
        }
      } catch (e) { /* blocked storage: fall back to the markup defaults */ }
    })();
  </script>
</head>
<body>
  <tf-root></tf-root>
</body>
</html>
