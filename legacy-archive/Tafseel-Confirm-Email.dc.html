<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="js/boot-prefs.js"></script>
<link rel="stylesheet" href="css/tafseel.css?v=identity-v1" />
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
<link rel="icon" href="assets/brand/favicon.ico" />
<meta name="theme-color" content="#5036D8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#020200" media="(prefers-color-scheme: dark)" />
<script src="js/locales.js"></script>
<script src="js/tafseel.js"></script>
<meta name="description" content="Confirm your email address to activate your Tafseel account." />
<link rel="canonical" href="Tafseel-Confirm-Email.dc.html" />
<meta name="robots" content="noindex, nofollow" />
<meta property="og:title" content="Confirm your email — Tafseel" />
<meta property="og:description" content="Confirm your email address to activate your Tafseel account." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Tafseel" />
<meta property="og:image" content="assets/brand/tafseel-mark.png" />
<meta property="og:locale" content="en" />
<meta property="og:locale:alternate" content="ar" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Confirm your email — Tafseel" />
<meta name="twitter:description" content="Confirm your email address to activate your Tafseel account." />
</head>
<body>
<x-dc>
<a class="tf-skip" href="#confirm-email-main" data-i18n="skip_to_content">Skip to main content</a>
<helmet><title>Confirm your email — Tafseel</title>
</helmet>

<div class="tf-auth-layout tf-confirm-email-layout" data-stack="auth">
  <main id="confirm-email-main" class="tf-auth-main tf-confirm-email-main">
    <div class="tf-auth-toolbar">
      <a href="Tafseel-Landing.dc.html" class="tf-auth-brand tf-confirm-email-brand" aria-label="Tafseel home">
        <img decoding="async" data-tafseel-mark src="assets/brand/tafseel-mark.svg" alt="" width="20" height="27" />
        <span translate="no" class="tf-mursala tf-wordmark"><span class="tf-wordmark__ar" lang="ar" dir="rtl">تفصيــل</span><span class="tf-wordmark__en" lang="en">Tafseel</span></span>
      </a>
      <div class="tf-auth-tools tf-confirm-email-tools">
        <button type="button" class="tf-lang-toggle" onClick="{{ toggleLang }}" aria-label="{{ langSwitchLabel }}" title="{{ langSwitchLabel }}"></button>
        <button type="button" class="tf-theme-toggle" onClick="{{ toggleTheme }}" aria-label="{{ themeToggleLabel }}"></button>
      </div>
    </div>

    <div class="tf-confirm-email-wrap">
      <section class="tf-confirm-email-card" aria-labelledby="confirm-email-title">
        <div class="tf-confirm-email-heading">
          <div class="tf-confirm-email-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 6.5h16v11H4z" />
              <path d="m4.5 7 7.5 6 7.5-6" />
              <path d="m8.5 17.5 3.5-3 3.5 3" />
            </svg>
          </div>
          <h1 id="confirm-email-title">{{ pageTitle }}</h1>
        </div>
        <p class="tf-confirm-email-lede">{{ pageBody }}</p>
        <sc-if value="{{ showEmail }}" hint-placeholder-val="{{ false }}">
          <p class="tf-confirm-email-address" dir="ltr">{{ email }}</p>
        </sc-if>
        <div class="tf-confirm-email-note">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
          <p>{{ helpText }}</p>
        </div>
        <a class="tf-button tf-confirm-email-login" sc-camel-href="{{ loginHref }}">{{ loginLabel }}</a>
      </section>
    </div>
  </main>

  <aside class="tf-auth-aside tf-ink-band" data-hide-sm="1" data-pattern="bottom" data-pattern-tone="lime" data-pattern-scale="lg">
    <div>
      <img decoding="async" data-tafseel-mark data-tafseel-mark-force="dark" src="assets/brand/tafseel-mark-dark.svg" alt="Tafseel" width="68" height="92" />
      <h2 dir="rtl" lang="ar" translate="no">درسك على مقاسك.</h2>
      <p class="tf-mursala">Education, tailored to you.</p>
    </div>
  </aside>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { lang: Tafseel.lang, theme: Tafseel.theme };

  componentDidMount() {
    this._sub = Tafseel.onChange(() => {
      document.title = Tafseel.t('confirm_email_document_title');
      this.setState({ lang: Tafseel.lang, theme: Tafseel.theme });
    });
    document.title = Tafseel.t('confirm_email_document_title');
  }

  componentWillUnmount() { Tafseel.offChange(this._sub); }

  renderVals() {
    const query = new URLSearchParams(location.search);
    const email = (query.get('email') || '').trim();
    const role = query.get('role') === 'teacher' ? 'teacher' : 'student';
    const deliveryFailed = query.get('delivery') === 'failed';
    const loginReturn = role === 'student' ? 'Tafseel-Browse-Teachers.dc.html' : '';
    return {
      langSwitchLabel: Tafseel.t('admin_switch_language'),
      themeToggleLabel: Tafseel.t('req_toggle_theme'),
      toggleLang: () => Tafseel.toggleLang(),
      toggleTheme: () => Tafseel.toggleTheme(),
      pageTitle: Tafseel.t(deliveryFailed ? 'confirm_email_failed_title' : 'confirm_email_title'),
      pageBody: Tafseel.t(deliveryFailed ? 'confirm_email_failed_body' : 'confirm_email_body'),
      helpText: Tafseel.t(deliveryFailed ? 'confirm_email_failed_help' : 'confirm_email_help'),
      email,
      showEmail: !!email,
      loginLabel: Tafseel.t('confirm_email_login'),
      loginHref: Tafseel.authHref(loginReturn)
    };
  }
}
</script>
</body>
</html>
