<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Default Tafseel teacher avatar</title>
  <desc id="description">A teacher in front of a chalkboard, on the Tafseel violet.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5E45EA" />
      <stop offset="1" stop-color="#3A279F" />
    </linearGradient>
  </defs>
  <!-- Full bleed: the frames around it are rounded squares and circles, and both crop a square cleanly. -->
  <rect width="256" height="256" fill="url(#canvas)" />
  <!-- The chalkboard: a line of working on the left, a tick on the right, the ledge below. -->
  <rect x="30" y="30" width="196" height="120" rx="12" fill="#131218" />
  <path d="M54 62h42M54 86h26" fill="none" stroke="#DDFA64" stroke-width="8" stroke-linecap="round" />
  <path d="M170 70l12 12 24-26" fill="none" stroke="#F8F4E8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="24" y="146" width="208" height="10" rx="5" fill="#0B0A10" />
  <!-- The teacher, with a collar that reads as someone standing at the front of the room. -->
  <circle cx="128" cy="112" r="36" fill="#F8F4E8" />
  <path d="M50 256c0-60 35-94 78-94s78 34 78 94Z" fill="#F8F4E8" />
  <path d="M106 164l22 26 22-26" fill="none" stroke="#5036D8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
